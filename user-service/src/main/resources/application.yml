spring.application.name=user-service
server.port=8001

spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere_user_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.cloud.config.enabled=false

app.security.jwt:
  secret: "your-secret-key-make-it-long-and-secure-at-least-32-characters"
  expiration: 3600000
  refresh-token-secret: "your-refresh-token-secret-key-make-it-long-and-secure"
  refresh-token-expiration: 604800000

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15000
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
