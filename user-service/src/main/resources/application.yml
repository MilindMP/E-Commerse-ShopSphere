spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/shopsphere_user_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  cloud:
    config:
      enabled: false

server:
  port: 8001

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  security:
    jwt:
      secret: mySuperSecretJwtKeyForShopSphereMicroservicesProject2026SecureTokenGeneration123456789
      expiration: 3600000
      refresh-token-secret: mySuperSecretJwtKeyForShopSphereMicroservicesProject2026SecureTokenGeneration123456789
      refresh-token-expiration: 604800000

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus