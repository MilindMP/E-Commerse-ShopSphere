input {
  tcp {
    port => 5000
    type => "log"
  }
  udp {
    port => 5000
    type => "log"
  }
}

filter {
  if [type] == "log" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "shopsphere-logs-%{+YYYY.MM.dd}"
  }
}
